name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false

jobs:
  nf-test:
    name: nf-test (stub)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '24.10.5'

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      # No containers and no R, so this stays in the seconds range
      - name: Run test suite
        run: nf-test test --verbose

  lint-r:
    name: Parse R scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      # Catches syntax errors without needing Seurat, scRank or hdWGCNA installed
      - name: Check every script parses
        run: |
          for f in bin/*.R; do
            echo "parsing $f"
            Rscript -e "invisible(parse('$f'))"
          done
