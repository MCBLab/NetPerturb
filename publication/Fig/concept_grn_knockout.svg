<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1560 750" width="1560" height="750" role="img" font-family="DejaVu Sans, Arial, sans-serif" fill="#0b0b0b" aria-label="Two cell identities each give their own gene regulatory network. The target gene T has strong edges in the first network: cutting them breaks the network apart and moves the genes at the end of those edges the most. In the second network T is peripheral, the wiring holds and almost nothing moves. The score is how much the network changed; the moved genes are the knockout's differentially regulated genes.">
